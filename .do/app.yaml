# DigitalOcean App Platform spec for miamibeerescue.com
# One Node service: serves public/ and handles POST /api/leads.
name: miamibeerescue
region: nyc
services:
  - name: web
    environment_slug: node-js
    github:
      repo: cocochief/miamibeerescue
      # Deploys from the working branch. Update if the default branch changes.
      branch: claude/awesome-ritchie-k60o5c
      deploy_on_push: true
    build_command: npm ci --omit=dev
    run_command: node server.js
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /healthz
    routes:
      - path: /
    envs:
      - key: NODE_ENV
        value: production
      - key: LEAD_NOTIFY_EMAIL
        value: removal@miamibeerescue.com
      # Set these two in the dashboard as encrypted values, never here:
      #   GMAIL_USER
      #   GMAIL_APP_PASSWORD
domains:
  - domain: miamibeerescue.com
    type: PRIMARY
  - domain: www.miamibeerescue.com
    type: ALIAS
